<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" 
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>MAJORSHIP LET ENHANCEMENT</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <style>
            :root{
                --primary-color:#5B8C5A;
                --secondary-color:#34495E;
                --accent-color:#FFC300;
                --bot-bg:#E0E0E0;
                --user-bg:var(--primary-color);
                --bot-color:#333333;
                --user-color:white;
                --bg-dark:#2C3E50;
                --bg-medium:#34495E;
                --bg-light:#4A63F7;
                --font-family:'Inter', 'Sogue UI', Tahoma, Geneva, Verdana, sans-serif;
                --border-radius-main:18px;
                --border-radius-button:30px;
                --shadow-light:0 4px 15px rgba(0,0,0,0.4);
                --shadow-medium:0 8px 25px rgba(0,0,0,0.6);
                --shadow-deep:0 12px 35px rgba(0,0,0,0.7);
                --primary-color-rgb:91,140,90;
                --accent-color-rgb:255,195,0;
            }
            body{
                font-family:var(--font-family);
                margin:0;
                padding:0;
                background-color:var(--bg-dark);
                color:white;
                display:flex;
                flex-direction:column;
                min-height:100vh;
                justify-content:flex-start;
                align-items:center;
                overflow-y:auto;
            }
            header{
                background:linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 100%);
                color:white;
                padding:1rem;
                text-align:center;
                font-weight:700;
                font-size:1.8rem;
                letter-spacing:0.1em;
                box-shadow:var(--shadow-deep);
                width:100%;
                position:fixed;
                top:0;
                left:0;
                z-index:1000;
                border-bottom-left-radius:15px;
                border-bottom-right-radius:15px;
                min-height:60px;
                display:flex;
                align-items:center;
                justify-content:center;
            }
            main{
                flex-grow:1;
                display:flex;
                flex-direction:column;
                width:90%;
                margin:90px auto 1.5rem auto;
                background-color:var(--bg-medium);
                border-radius:var(--border-radius-main);
                box-shadow:var(--shadow-deep);
                overflow:hidden;
                padding:1.8rem;
                box-sizing:border-box;
                min-height:450px;
                position:relative;
                z-index:1;
            }
            section{
                margin-bottom:2rem;
                padding:0 0.5rem;
            }
            h2{
                color:var(--accent-color);
                font-weight:700;
                margin-bottom:1.8rem;
                text-align:center;
                font-size:1.75rem;
                text-shadow:0 3px 6px rgba(0,0,0,0.4);
            }
            h3{
                color:var(--accent-color);
                font-weight:600;
                margin-bottom:1rem;
                text-align:center;
                font-size:1.3rem;
            }
            button{
                background:linear-gradient(135deg, var(--secondary-color), var(--primary-color));
                border:none;
                border-radius:var(--border-radius-button);
                padding:1rem 2rem;
                font-size:1.15rem;
                font-weight:600;
                color:white;
                cursor:pointer;
                box-shadow:var(--shadow-light);
                transition:all 0.3s ease;
                width:100%;
                max-width:280px;
                text-transform:capitalize;
                letter-spacing:0.04em;
                flex-shrink:0;
            }
            button:hover{
                background:linear-gradient(135deg, #46627C, #6FA66E);
                box-shadow:0 8px 25px rgba(var(--primary-color-rgb), 0.6);
                transform:translateY(-3px);
            }
            button:active{
                transform:translateY(0);
                box-shadow:0 2px 10px rgba(var(--primary-color-rgb), 0.4);
            }
            .two-columns{
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:2rem;
                margin-bottom:1rem;
            }
            .column{
                background:var(--bg-light);
                border-radius:var(--border-radius-main);
                padding:1.5rem;
                display:flex;
                flex-direction:column;
                align-items:center;
                box-shadow:var(--shadow-light);
            }
            .column h3{
                margin-top:0;
                color:var(--accent-color);
                font-size:1.4rem;
                border-bottom:2px solid rgba(255,255,255,0.1);
                padding-bottom:0.5rem;
                width:100%;
            }
            .column .branch-buttons{
                display:flex;
                flex-direction:column;
                gap:1rem;
                width:100%;
                align-items:center;
            }
            .column-button{
                max-width:100%;
                font-size:1rem;
                padding:0.9rem 1.5rem;
            }
            #lessonDisplay{
                display:none;
                flex-direction:column;
                animation:fadeIn 0.4s ease;
            }
            #lessonDisplay.visible{
                display:flex;
            }
            .lesson-card{
                background-color:var(--bg-light);
                border-radius:var(--border-radius-main);
                padding:1.5rem;
                margin-bottom:1.5rem;
                box-shadow:var(--shadow-light);
                animation:fadeIn 0.5s ease forwards;
                opacity:0;
            }
            .lesson-card h3{
                color:var(--accent-color);
                margin-top:0;
                font-size:1.4rem;
            }
            .lesson-card p{
                line-height:1.7;
                font-size:1.05rem;
                color:#eee;
            }
            .lesson-card img{
                max-width:100%;
                border-radius:12px;
                margin-top:1rem;
                box-shadow:0 4px 15px rgba(0,0,0,0.4);
            }
            #quizDisplay{
                display:none;
                flex-direction:column;
                animation:fadeIn 0.4s ease;
            }
            #quizDisplay.visible{
                display:flex;
            }
            .quiz-card{
                background-color:var(--bg-light);
                border-radius:var(--border-radius-main);
                padding:1.5rem;
                margin-bottom:1.5rem;
                box-shadow:var(--shadow-light);
                animation:fadeIn 0.5s ease forwards;
                opacity:0;
            }
            .quiz-card h4{
                color:var(--accent-color);
                margin-top:0;
                font-size:1.2rem;
                margin-bottom:1rem;
                line-height:1.4;
            }
            .quiz-options{
                display:flex;
                flex-direction:column;
                gap:0.7rem;
            }
            .quiz-option{
                background:linear-gradient(135deg, #3d5a80, #4A637F);
                border:2px solid transparent;
                border-radius:16px;
                padding:0.9rem 1.2rem;
                cursor:pointer;
                transition:all 0.25s ease;
                font-size:1rem;
                color:white;
                text-align:left;
                display:flex;
                align-items:center;
                gap:0.6rem;
            }
            .quiz-option:hover:not(.disabled):not(.eliminated){
                border-color:var(--accent-color);
                transform:translateX(5px);
                background:linear-gradient(135deg, #46627C, #5B8C5A);
            }
            .quiz-option.correct{
                background:linear-gradient(135deg, #2d6a4f, #40916c);
                border-color:#52b788;
            }
            .quiz-option.wrong{
                background:linear-gradient(135deg, #9d0208, #d00000);
                border-color:#ff4d6d;
            }
            .quiz-option.disabled{
                pointer-events:none;
                opacity:0.7;
            }
            .quiz-option.eliminated{
                background:#555;
                opacity:0.35;
                text-decoration:line-through;
                border-color:#777;
                pointer-events:none;
                transform:none;
                filter:grayscale(1);
            }
            .rank-badge{
                font-size:0.7rem;
                background:rgba(0,0,0,0.35);
                padding:0.15rem 0.5rem;
                border-radius:10px;
                color:#ccc;
                font-weight:700;
                min-width:22px;
                text-align:center;
            }
            .quiz-option.eliminated .rank-badge{
                background:rgba(0,0,0,0.2);
                color:#888;
            }
            .lifeline-buttons{
                display:flex;
                gap:0.6rem;
                margin:1.2rem 0 0.5rem;
                flex-wrap:wrap;
                justify-content:center;
            }
            .lifeline-btn{
                background:linear-gradient(135deg, #6A1B9A, #8E24AA);
                border:none;
                border-radius:20px;
                padding:0.55rem 1.1rem;
                font-size:0.82rem;
                font-weight:600;
                color:white;
                cursor:pointer;
                box-shadow:0 3px 10px rgba(0,0,0,0.3);
                transition:all 0.3s ease;
                letter-spacing:0.02em;
                flex:1 1 auto;
                min-width:100px;
                max-width:160px;
            }
            .lifeline-btn:hover:not(.disabled){
                transform:translateY(-2px);
                box-shadow:0 6px 18px rgba(106,27,154,0.5);
                background:linear-gradient(135deg, #7B21B2, #9C27B0);
            }
            .lifeline-btn.disabled{
                opacity:0.35;
                cursor:not-allowed;
                transform:none;
                filter:grayscale(0.8);
            }
            .feedback{
                margin-top:0.8rem;
                padding:0.8rem 1rem;
                border-radius:12px;
                font-weight:600;
                display:none;
                line-height:1.5;
                font-size:0.95rem;
            }
            .feedback.show{
                display:block;
                animation:fadeIn 0.3s ease;
            }
            .feedback.correct-msg{
                background-color:rgba(45,106,79,0.25);
                color:#95d5b2;
                border:1px solid #52b788;
            }
            .feedback.wrong-msg{
                background-color:rgba(157,2,8,0.25);
                color:#ffccd5;
                border:1px solid #ff4d6d;
            }
            .feedback.info-msg{
                background-color:rgba(74,144,226,0.2);
                color:#aed9ff;
                border:1px solid #4A90E2;
            }
            .back-btn-container{
                margin-top:1.5rem;
                text-align:center;
            }
            button.nav-back-btn{
                background:linear-gradient(135deg, #4A90E2, #6A1B9A);
                border:none;
                border-radius:var(--border-radius-button);
                padding:0.8rem 1.5rem;
                font-size:1rem;
                font-weight:600;
                color:white;
                cursor:pointer;
                box-shadow:var(--shadow-light);
                transition:all 0.3s ease;
                width:100%;
                max-width:200px;
                text-transform:capitalize;
                letter-spacing:0.03em;
            }
            button.nav-back-btn:hover{
                background:linear-gradient(135deg, #5C9FEF, #7B21B2);
                box-shadow:0 8px 25px rgba(var(primary-color-rgb), 0.6);
                transform:translateY(-2px);
            }
            button.nav-back-btn:active{
                transform:translateY(0);
            }
            @keyframes fadeIn{
                from{
                    opacity:0;
                    transform:translateY(10px);
                } to {
                    opacity:1;
                    transform:translateY(0);
                }
            }
            ::-webkit-scrollbar{
                width:8px;
            }
            ::-webkit-scrollbar-track{
                background:var(--bg-medium);
                border-radius:5px;
            }
            ::-webkit-scrollbar-thumb{
                background:var(--primary-color);
                border-radius:4px;
            }
            ::-webkit-scrollbar-thumb:hover{
                background:#6FA66E;
            }
            @media (max-width:768px){
                header{
                    font-size:1.6rem;
                    min-height:55px;
                }
                main{
                    margin-top:80px;
                    padding:1.2rem;
                    width:95%;
                }
                h2{
                    font-size:1.5rem;
                }
                .two-columns{
                    grid-template-columns:1fr;
                    gap:1.5rem;
                }
                button{
                    padding:0.8rem 1.2rem;
                    font-size:1rem;
                }
                .lifeline-btn{
                    font-size:0.78rem;
                    padding:0.5rem 0.8rem;
                }
            }
            @media (max-width:480px){
                header{
                    font-size:1.4rem;
                    min-height:50px;
                }
                main{
                    margin-top:70px;
                    padding:0.8rem;
                }
                h2{
                    font-size:1.3rem;
                }
                .column{
                    padding:1rem;
                }
                .lesson-card, .quiz-card{
                    padding:1rem;
                }
                .quiz-option{
                    padding:0.7rem 1rem;
                    font-size:0.9rem;
                }
            }
        </style>
    </head>
    <body>
        <header>MAJORSHIP LET ENHANCEMENT</header>
        <main>
            <section id="mainMenu" role="region" aria-label="Main Menu">
                <h2>What would you like to do?</h2>
                <div class="two-columns">
                <div class="column">
                    <h3>📚Lessons</h3>
                    <div class="branch-buttons">
                        <button onclick="openLesson('Biology')" aria-label="Biology Lesson">Biology</button>
                        <button onclick="openLesson('Chemistry')" aria-label="Chemistry Lesson">Chemistry</button>
                        <button onclick="openLesson('Physics')" aria-label="Physics Lesson">Physics</button>
                    </div>
                </div>

                <div class="column">
                    <h3>❓Quizzes</h3>
                    <div class="branch-buttons">
                        <button onclick="openQuiz('Biology')" aria-label="Biology Quiz">Biology</button>
                        <button onclick="openQuiz('Chemistry')" aria-label="Chemistry Quiz">Chemistry</button>
                        <button onclick="openQuiz('Physics')" aria-label="Physics Quiz">Physics</button>
                    </div>
                </div>
                </div>
            </section>

            <section id="lesson-display" role="region" aria-label="Lesson Content">
                <h2 id="lessonTitle">Lesson</h2>
                <div id="lessonContent"></div>
                <div class="back-button-container">
                    <button type="button" class="nav-back-btn" onclick="goBackToMenu()">Back to Menu</button>
                </div>
            </section>

            <section id="quiz-display" role="region" aria-label="Quiz Content">
                <h2 id="quizTitle">Quiz</h2>
                <div id="quizContent"></div>
                <div class="back-button-container">
                    <button type="button" class="nav-back-btn" onclick="goBackToMenu()">Back to Menu</button>
                </div>
            </section>
        </main>
        <script>
            const lessons = {
                "Biology":[
                    {
                        title:"Genetics",
                        text:"Genetics is the study of heredity.",
                        image:"https:i.imgur.com/.jpg"
                    }
                ],
                "Chemistry":[
                    {
                        title:"Atoms",
                        text:"Atom is the smallest unit of matter.",
                        image:"https:i.imgur.com/.jpg"
                    }
                ],
                "Physics":[
                    {
                      title:"Force and Motion",
                        text:"Force is a push or pull.",
                        image:"https:i.imgur.com/.jpg"
                    }  
                ]
            };

            const quizzes = {
                "Biology":[
                    {
                        question:"What does DNA stands for?",
                        options: [
                            { text: "Deoxyribonucleic Acid", rank:1},
                            { text: "Dinucleic Acid", rank:3},
                            { text: "Double Helix Acid", rank:2},
                            { text: "Dynamic Acid", rank:4}
                        ],
                        explanation: "DNA stands for Deoxyribonucleic Acid, Rank 4 (Dynamic Acid) is completely made up, Rank 3 (Dinucleic) sounds close but is wrong, Rank 2 (Double Helix), describes the shape not the name."
                    },
                ],
                "Chemistry":[
                    {
                        question:"What is the smallest unit of matter that retains an element identity?",
                        options: [
                            { text: "Molecule", rank:3},
                            { text: "Atom", rank:1},
                            { text: "Electron", rank:2},
                            { text: "Proton", rank:4}
                        ],
                        explanation: "The atom is the smallest unit keeping an elements identity . An electron (Rank 2) is just a subatomic particle. A molecule (Rank 3) is made of multiple atoms. A proton (Rank 4) is just part oof the nucleus."
                    },
                ],
                "Physics":[
                    {
                        question:"What is the force that pulls object toward the Earth?",
                        options: [
                            { text: "Magnetism", rank:3},
                            { text: "Friction", rank:2},
                            { text: "Gravity", rank:1},
                            { text: "Inertia", rank:4}
                        ],
                        explanation: "Gravity pulls object towards the Earth. Friction (Rank 2) opposites motion. Magnetism (Rank 3) attracts magnetic materials. Inertia (Rank 4) is resistance."
                    },
                ]
            };

            function shuffleArray(array){
                const arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            const mainMenu = document.getElementById('mainMenu');
            const lessonDisplay = document.getElementById('lesson-display');
            const lessonContent = document.getElementById('lessonContent');
            const lessonTitle = document.getElementById('lessonTitle');

            const quizDisplay = document.getElementById('quiz-display');
            const quizContent = document.getElementById('quizContent');
            const quizTitle = document.getElementById('quizTitle');

            function openLesson(branch){
                mainMenu.style.display = 'none';
                lessonDisplay.classList.add('visible');
                lessonTitle.textContent = branch + " Lessons";

                lessonContent.innerHTML = '';
                const branchLessons = lessons[branch] || [];

                branchLessons.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'lesson-card';
                    card.style.animationDelay = (index * 0.12) + 's';
                    card.innerHTML = `
                    <h3>${item.title}</h3>
                    <p>${item.text}</p>
                    <img src="${item.image}" alt="${item.title}" onerror="this.style.display='none'">
                    `;
                    lessonContent.appendChild(card);
                });
            }

            function openQuiz(branch){
                mainMenu.style.display = 'none';
                quizDisplay.classList.add('visible');
                quizTitle.textContent = branch + " Quiz";

                quizContent.innerHTML = '';
                const branchQuizzes = quizzes[branch] || [];

                const shuffledQuestions = shuffleArray(branchQuizzes);

                shuffledQuestions.forEach((q, index) => {
                    const shuffledOptions = shuffleArray(q.options);

                    const card = document.createElement('div');
                    card.className = 'quiz-card';
                    card.style.animationDelay = (index * 0.12) + 's';
                    card.dataset.explanation = q.explanation;
                    card.dataset.answered = 'false';

                    const optionsHtml = shuffledOptions.map((opt, i) =>`
                    <div class="quiz-option" data-rank="${opt.rank}" data-text="${opt.text.replace(/"/g, '&quot;')}" onclick="selectOption(this)">
                        <strong>${String.fromCharCode(65 + i)}.</strong> ${opt.text}
                        </div>`).join('');
                        
                        card.innerHTML = `
                        <h4>Q${index + 1}. ${q.question}</h4>
                        <div class="quiz-options">${optionsHtml}</div>
                        <div class="lifeline-buttons">
                        <button type="button" class="lifeline-btn eliminate-2" onclick="useLifeLine(this, 'eliminate 2')">Eliminate 2</button>
                        <button type="button" class="lifeline-btn eliminate-1" onclick="useLifeLine(this, 'eliminate 1')">Eliminate 1</button>
                        <button type="button" class="lifeline-btn show-answer" onclick="useLifeLine(this, 'showAnswer')">Correct Answer</button>
                        </div>
                        <div class="feedback"></div>
                        `;
                        quizContent.appendChild(card);
                });
            }

            function selectOption(element){
                const card = element.closest('.quiz-card');
                if (card.dataset.answered === 'true') return;
                card.dataset.answered = 'true';

                const options = card.querySelectorAll('.quiz-option');
                const feedback = card.querySelector('.feedback');
                const explanation = card.dataset.explanation;
                const selectedRank = parseInt(element.dataset.rank);

                options.forEach(opt => opt.classList.add('disabled'));
                card.querySelectorAll('.lifeline-btn').forEach(btn => btn.disabled = true);

                if (selectedRank === 1){
                    element.classList.add('correct');
                    feedback.textContent = "✅ Correct! Rank 1 is the right answer. " + explanation;
                    feedback.className = 'feedback show correct-msg';
                } else {
                    element.classList.add('wrong');
                    options.forEach(opt => {
                        if (parseInt(opt.dataset.rank) === 1) opt.classList.add('correct');
                    });
                    feedback.textContent = `❌ Incorrect. You chose Rank ${selectedRank}. Rank 1 is the correct answer. ` + explanation;
                    feedback.className = 'feedback show wrong-msg';
                }
            }

            function useLifeLine(btn, type){
                const card = btn.closest('.quiz-card');
                if (card.dataset.answered === 'true') return;

                const feedback = card.querySelector('.feedback');
                const options = Array.from(card.querySelectorAll('.quiz-option'));
                const explanation = card.dataset.explanation;

                btn.disabled = true;
                if (type === 'eliminate 2'){
                    const wrongOptions = options.filter(opt => parseInt(opt.dataset.rank) > 1 && !opt.classList.contains('eliminated'));
                    wrongOptions.sort((a, b) => parseInt(b.dataset.rank) - parseInt(a.dataset.rank));
                    const toEliminate = wrongOptions.slice(0, Math.min(2, wrongOptions.length));

                    toEliminate.forEach(opt => opt.classList.add('eliminated'));

                    const eliminateRanks = toEliminate.map(opt => `Rank ${opt.dataset.rank}`).join(' and ');
                    feedback.textContent = `Eliminated ${eliminateRanks} - the two worst choices. ${explanation}`;
                    feedback.className = 'feedback show info-msg';
                } 
                else if (type === 'eliminate 1'){
                    const wrongOptions = options.filter(opt => parseInt(opt.dataset.rank) > 1 && !opt.classList.contains('eliminated'));

                    if (wrongOptions.length > 0){
                        wrongOptions.sort((a, b) => parseInt(b.dataset.rank) - parseInt(a.dataset.rank));
                        const toEliminate = wrongOptions[0];
                        toEliminate.classList.add('eliminated');

                        feedback.textContent = `Eliminated Rank ${toEliminate.dataset.rank} - the next worst choice. ${explanation}`;
                    } else {
                        feedback.textContent = `No more wrong answers to eliminate! ${explanation}`;
                    }
                    feedback.className = 'feedback show info-msg';
                }
                else if (type === 'showAnswer'){
                    card.dataset.answered = 'true';

                    options.forEach(opt => {
                        opt.classList.add('disabled');
                        if (parseInt(opt.dataset.rank) === 1){
                            opt.classList.add('correct');
                        }
                    });
                    card.querySelectorAll('.lifeline-btn').forEach(b => b.disabled = true);

                    feedback.textContent = `Correct answer revealed: Rank 1! ${explanation}`;
                    feedback.className = 'feedback show correct-msg';
                }
            }

            function goBackToMenu(){
                lessonDisplay.classList.remove('visible');
                quizDisplay.classList.remove('visible');
                mainMenu.style.display = 'block';
            }
        </script>
    </body>
</html>
